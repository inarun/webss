name: Build resume page

on:
  push:
    branches: [main]
    paths:
      - resume.docx
      - Nusayb-Nurani-Resume.pdf
      - data/resume-links.json
      - tools/build_resume.py
      - .github/workflows/resume.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-resume
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # A PDF committed alongside or after resume.docx is kept as is, so a Word
      # export can still be uploaded by hand.
      - name: Check whether the PDF is older than resume.docx
        id: pdf
        run: |
          docx=$(git log -1 --format=%ct -- resume.docx)
          pdf=$(git log -1 --format=%ct -- Nusayb-Nurani-Resume.pdf)
          if [ -z "$pdf" ] || { [ -n "$docx" ] && [ "$docx" -gt "$pdf" ]; }; then
            echo "stale=true" >> "$GITHUB_OUTPUT"
          fi

      # Georgia and Arial are Microsoft fonts absent on Linux. Gelasio and
      # Liberation Sans share their metrics, so line breaks and page count match Word.
      - name: Install LibreOffice and metric-compatible fonts
        if: steps.pdf.outputs.stale == 'true'
        env:
          GELASIO: https://raw.githubusercontent.com/SorkinType/Gelasio/7ab20e7e5c42791e603b9ee3201a0b49849cfdb2/fonts/ttf
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            libreoffice-writer fonts-liberation2 poppler-utils
          mkdir -p ~/.local/share/fonts ~/.config/fontconfig
          for style in Regular Bold Italic BoldItalic; do
            curl -fsSL -o ~/.local/share/fonts/Gelasio-$style.ttf "$GELASIO/Gelasio-$style.ttf"
          done
          cat > ~/.config/fontconfig/fonts.conf <<'EOF'
          <?xml version="1.0"?>
          <!DOCTYPE fontconfig SYSTEM "fonts.dtd">
          <fontconfig>
            <alias binding="same">
              <family>Georgia</family>
              <accept><family>Gelasio</family></accept>
            </alias>
          </fontconfig>
          EOF
          fc-cache -f
          fc-match Georgia
          fc-match Arial

      # Runs before the page build, which dates the "Updated" line from this PDF.
      # A fallback font fails the run, so a mis-set PDF is never committed.
      - name: Regenerate Nusayb-Nurani-Resume.pdf from resume.docx
        if: steps.pdf.outputs.stale == 'true'
        run: |
          out="$RUNNER_TEMP/pdf"
          mkdir -p "$out"
          soffice --headless --convert-to pdf --outdir "$out" resume.docx
          pdfinfo "$out/resume.pdf" | grep -E '^(Pages|CreationDate)'
          pdffonts "$out/resume.pdf"
          other=$(pdffonts "$out/resume.pdf" | tail -n +3 | awk '{print $1}' \
                  | grep -viE 'gelasio|liberation|opensymbol' || true)
          if [ -n "$other" ]; then
            echo "::error::Unexpected fallback font(s) in the PDF: $(echo $other)"
            exit 1
          fi
          mv "$out/resume.pdf" Nusayb-Nurani-Resume.pdf

      # No dependency step: the script is standard library only. A failure here
      # commits nothing, so the deployed page keeps its last good version.
      - name: Regenerate resume.html and data/resume.json
        run: python tools/build_resume.py

      - name: Commit if the output changed
        run: |
          files="resume.html data/resume.json Nusayb-Nurani-Resume.pdf"
          if git diff --quiet -- $files; then
            echo "No change to the generated files."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $files
          git commit -m "Rebuild resume page and PDF from resume.docx"
          git push
