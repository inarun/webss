  const amp=REDUCE?0:(state.mode==='overview'?1:state.cur?.25:.45),pt=parT.clone().multiplyScalar(amp);par.lerp(pt,1-Math.pow(.04,dt));
  const kk=1-Math.pow(.02,dt);look.yaw+=(look.ty-look.yaw)*kk;look.pitch+=(look.tp-look.pitch)*kk;pan.v+=(pan.t-pan.v)*kk;
  motion=par.distanceTo(pt)+Math.abs(look.ty-look.yaw)+Math.abs(look.tp-look.pitch)+Math.abs(pan.t-pan.v);
  if(!drag&&!state.cur){look.ty*=1-dt*.15;look.tp*=1-dt*.15}
  if(ORB&&state.mode==='overview'&&!camMoving&&!orbitHold){ORB.yaw+=(ORB.ty-ORB.yaw)*kk;ORB.pitch+=(ORB.tp-ORB.pitch)*kk;const p=orbitPose(ORB.yaw,ORB.pitch);
    rig.pos.lerp(p.pos,INSTANT?1:1-Math.pow(.05,dt));rig.look.copy(rig.pos).add(p.look.sub(p.pos));motion+=Math.abs(ORB.ty-ORB.yaw)+Math.abs(ORB.tp-ORB.pitch)+rig.pos.distanceTo(p.pos)}
  const rp=pan.ax?panPos(rig.pos,pan.ax,pan.v,tmpP):rig.pos,rl=pan.ax?tmpL.copy(rig.look).addScaledVector(pan.ax,pan.v):rig.look;
  const fwd=tmpV.copy(rl).sub(rp);const dist=fwd.length();fwd.normalize();const right=V().crossVectors(fwd,UP).normalize();
  fwd.applyAxisAngle(UP,look.yaw).applyAxisAngle(right,-look.pitch);
  camera.position.copy(rp).addScaledVector(right,par.x*.12).add(V(0,par.y*.055,0));
  camera.lookAt(V().copy(camera.position).addScaledVector(fwd,dist).addScaledVector(right,par.x*.05));
  if(Math.abs(camera.fov-rig.fov)>.01||Math.abs(camera.filmOffset-rig.film)>.01){camera.fov=rig.fov;camera.filmOffset=rig.film;camera.updateProjectionMatrix()}
  sky.position.copy(camera.position);
  hovered=null;
  if(ndc.x<5&&!state.busy&&!tweens.size&&!drag){ray.setFromCamera(ndc,camera);const h=ray.intersectObjects(pickables,false)[0];if(h&&h.object.userData.entry.state==='shelf')hovered=h.object.userData.entry}
  for(const e of books){if(e.state!=='shelf')continue;const tg=e===hovered?1:0;if(Math.abs(e.hover-tg)>.001){motion+=.01;e.hover+=(tg-e.hover)*(1-Math.pow(.0005,dt));e.g.position.copy(e.home.p).addScaledVector(e.outW,(e.out==='z'?.06:.025)*e.hover).add(V(0,.006*e.hover,0))}}
  if(hovered){tip.innerHTML=`${hovered.b.title}<small>${SERIES[hovered.sid].name} · ${hovered.n}</small>`;tip.classList.add('on');cvs.style.cursor='pointer'}else{tip.classList.remove('on');cvs.style.cursor=state.cur?'pointer':(drag?.moved?'grabbing':'grab')}
  if(!RH&&state.cur&&state.cur.state==='presented'&&!state.busy&&!REDUCE){const e=state.cur;const sway=new THREE.Quaternion().setFromEuler(new THREE.Euler(-par.y*.12+Math.sin(t*.7)*.01,par.x*.25,0));e.g.quaternion.copy(e.T.q).multiply(sway)}
  {const bs=RH&&state.cur?.12:.2;bloom.strength=INSTANT?bs:bloom.strength+(bs-bloom.strength)*(1-Math.pow(.2,dt))}
  flameU.time.value=t;grade.uniforms.time.value=t;
  flicker(t);fireFrame(t);volUpdate();if(fire)fire.SU.pxs.value=2*Math.tan(camera.fov*Math.PI/360)/(app.clientHeight*DPR);
  setHands();
}
// Phones draw at 30 fps while nothing moves (the flipbook runs at 24) and at the display rate during interaction.
// The governor steps quality down, cheapest loss first, while the median frame interval stays above 38 ms; a 30 Hz
// cap such as iOS Low Power Mode stays under that line.
const IDLE_MS=SMALL?1000/30-3:0;
const setDPR=d=>{DPR=d;renderer.setPixelRatio(d);composer.setPixelRatio(d);resize()};
const GOV={lvl:0,win:[],skip:45,bad:0,steps:[]};
for(let d=DPR;d>1.01;){d=Math.max(1,d-.25);const v=d;GOV.steps.push(()=>setDPR(v))}
GOV.steps.push(()=>{if(volPass){volPass.div=4;resize()}},()=>{if(volPass)volPass.enabled=false;if(dust)dust.visible=false},()=>{bloom.enabled=false},()=>setDPR(.75));
function govern(dt){if(GOV.skip>0){GOV.skip--;return}GOV.win.push(dt);if(GOV.win.length<40)return;
  const m=GOV.win.sort((a,b)=>a-b)[20];GOV.win.length=0;
  if(m>.038&&GOV.lvl<GOV.steps.length){if(++GOV.bad>=2){GOV.bad=0;GOV.steps[GOV.lvl++]();GOV.skip=20}}else GOV.bad=0}
function loop(now){if(!visible||document.hidden){last=now;return}
  if(IDLE_MS&&!(drag||tweens.size||camMoving||motion>1e-4)&&now-lastDraw<IDLE_MS)return;
  const dt=(now-last)/1000;last=lastDraw=now;update(Math.min(dt,.05));composer.render();govern(dt)}
markChips();

window.__baked={present:i=>present(books[i]),open:()=>setOpen(true),focus:focusSeries,overview,variant:setVariant,books,camera,rig,quality:()=>GOV.lvl};
async function applyTest(s){
  if(s.variant&&s.variant!==variant)await setVariant(s.variant,false);
  if(state.cur){const e=state.cur;e.pivot.rotation.y=0;e.g.position.copy(e.home.p);e.g.quaternion.copy(e.home.q);setProbe(e,e.probe);e.state='shelf';state.cur=null;state.open=false;hidePanel()}
  state.series=s.series||null;state.mode=s.series?'focus':'overview';markChips();
  HAND_T=s.time?new Date(`2026-01-01T${s.time}`):null;setHands();
  orbitHold=!!(s.pose||s.post);if(ORB){ORB.yaw=ORB.ty=ORB.yaw0+(s.yaw||0);ORB.pitch=ORB.tp=ORB.pitch0+(s.pitch||0)}
  setRigInstant(s.series?spose(s.series):ORB?orbitPose(ORB.yaw,ORB.pitch):OVERVIEW);
  if(s.pose)setRigInstant({pos:VA(s.pose.pos),look:VA(s.pose.look),fov:s.pose.fov||50});
  if(s.present!=null){const e=books[s.present];await present(e);setRigInstant(RH?rehalPose():spose(e.sid,e));if(s.open)await setOpen(true)}
  if(s.post)setRigInstant({pos:VA(s.post.pos),look:VA(s.post.look),fov:s.post.fov||50});
  if(s.vol)for(const v in s.vol)Object.assign(CFG.vol[v],s.vol[v]);if(dust&&s.dust)dust.material.uniforms.gain.value=s.dust;if(fire&&s.fire)for(const k in s.fire)fire.U[k].value=s.fire[k];if(HEARTH_U&&s.hearth)for(const k in s.hearth)HEARTH_U[k].value=s.hearth[k];if(s.t!=null)elapsed=s.t;
  for(const k in FXN)FXN[k].visible=!(s.hide||[]).includes(k);if(dust)dust.visible=!(s.hide||[]).includes('dust');if(volPass)volPass.enabled=!(s.hide||[]).includes('vol');
  if(s.q)while(GOV.lvl<s.q)GOV.steps[GOV.lvl++]();
  if(s.pan!=null)pan.v=pan.t=pan.lo+(pan.hi-pan.lo)*s.pan;
  if(s.hover!=null){const e=books[s.hover];e.hover=1;e.g.position.copy(e.home.p).addScaledVector(e.outW,(e.out==='z'?.06:.025))}
}
// shaders compile behind the loading screen rather than on the first frames
await renderer.compileAsync(scene,camera).catch(()=>{});
window.__studyReady=true;$('load').style.opacity=0;setTimeout(()=>$('load')?.remove(),900);
if(TEST){INSTANT=true;const shots=TEST.shots||[TEST];const W=app.clientWidth,H=app.clientHeight;const cols=shots.length>1?2:1,rows=Math.ceil(shots.length/cols);
  const [cc,cg]=canvas(W*DPR,H*DPR);
  for(const [i,s] of shots.entries()){await applyTest(s);update(.016);composer.render(.016);cg.drawImage(renderer.domElement,(i%cols)*W*DPR/cols,Math.floor(i/cols)*H*DPR/rows,W*DPR/cols,H*DPR/rows)}
  INSTANT=false;$('load')?.remove();
  if(shots.length>1){cc.style.cssText='position:absolute;inset:0;z-index:9;width:100%;height:100%';app.appendChild(cc)}window.__DONE__=true}
