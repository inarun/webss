    <script src="script.js"></script>
    <script>
    (function () {
        'use strict';

        var stateEl = document.getElementById('writing-state');
        var listEl  = document.getElementById('post-list');
        var ctaEl   = document.getElementById('writing-cta');

        function escapeHTML(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function showEmpty() {
            stateEl.innerHTML =
                '<div class="writing-empty">' +
                '<p>New writing coming soon.</p>' +
                '<a href="https://nusayb.substack.com/subscribe" ' +
                   'target="_blank" rel="noopener">Subscribe for updates</a>' +
                '</div>';
        }

        function formatDate(str) {
            var d = new Date(str);
            if (!str || isNaN(d)) return '';
            return d.toLocaleDateString('en-US', {
                year: 'numeric', month: 'long', day: 'numeric'
            });
        }

        function renderPost(post) {
            var thumbHTML = post.image
                ? '<div class="post-thumb">' +
                  '<img src="' + escapeHTML(post.image) + '" alt="" loading="lazy">' +
                  '</div>'
                : '';

            var li = document.createElement('li');
            li.innerHTML =
                '<a class="post-item" href="' + escapeHTML(post.url) + '" target="_blank" rel="noopener">' +
                '<div class="post-inner">' +
                '<div class="post-text">' +
                '<span class="post-date">' + escapeHTML(formatDate(post.date)) + '</span>' +
                '<div class="post-title">' + escapeHTML(post.title) + '</div>' +
                '<p class="post-excerpt">' + escapeHTML(post.excerpt || '') + '</p>' +
                '</div>' +
                thumbHTML +
                '</div>' +
                '</a>';
            return li;
        }

        fetch('/api/writing')
            .then(function (r) {
                if (!r.ok) throw new Error('Network error');
                return r.json();
            })
            .then(function (data) {
                var posts = data.posts;
                if (!posts || posts.length === 0) {
                    showEmpty();
                    return;
                }

                posts.forEach(function (post) {
                    listEl.appendChild(renderPost(post));
                });

                stateEl.style.display = 'none';
                listEl.style.display  = '';
                ctaEl.style.display   = '';
            })
            .catch(function () {
                showEmpty();
            });
    })();
    </script>
