<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Not found — Nusayb Nurani</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <script>(function(){var t=localStorage.getItem('theme');if(!t)t=matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})()</script>
    <link rel="preload" href="/fonts/cormorant-garamond.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="/fonts/libre-franklin.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <nav class="nav">
        <div class="nav-links">
            <a href="/" class="nav-link">Home</a>
            <a href="/resume.html" class="nav-link">Resume</a>
            <a href="/bookshelf.html" class="nav-link">Bookshelf</a>
        </div>
        <button class="theme-toggle" aria-label="Toggle theme">
            <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
            <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        </button>
        <button class="nav-toggle" aria-label="Toggle menu">
            <span></span><span></span><span></span>
        </button>
    </nav>

    <main class="not-found-page">
        <p class="not-found-label">404</p>
        <h1 class="not-found-title">Not on the shelf.</h1>
        <div class="not-found-rule"></div>
        <p class="not-found-sub"><span class="not-found-path">That page</span> was checked out and never returned.</p>
        <p class="not-found-suggest" hidden>Did you mean <a href="/" data-page-link>Home</a>?</p>
        <div class="not-found-actions">
            <a href="/" data-page-link>Home</a>
            <a href="/bookshelf.html" data-page-link>Bookshelf</a>
        </div>

        <section class="not-found-picks" hidden aria-labelledby="not-found-picks-label">
            <h2 class="not-found-picks-label" id="not-found-picks-label">Meanwhile, from the shelf</h2>
            <ul role="list"></ul>
        </section>
    </main>

    <footer class="footer"><p><a href="https://github.com/inarun" target="_blank" rel="noopener" class="footer-link">GitHub</a></p></footer>

    <script src="/script.js"></script>
    <script>
    (function () {
        'use strict';

        var PAGES = [
            { href: '/',               name: 'Home',      keys: ['home', 'index', 'about', 'me', 'contact', 'email'] },
            { href: '/resume.html',    name: 'Resume',    keys: ['resume', 'cv', 'pdf', 'work', 'experience'] },
            { href: '/bookshelf.html', name: 'Bookshelf', keys: ['bookshelf', 'books', 'book', 'shelf', 'reading', 'read', 'library', 'interests', 'series', 'favorites'] }
        ];

        var path = location.pathname;
        var slug = path.replace(/\.html?$/i, '').replace(/^\/+|\/+$/g, '').split('/')[0].toLowerCase();

        // Echo the missing path when it is short and plain enough to read as prose.
        if (slug && /^[\w\-.\/~]{1,40}$/.test(path)) {
            document.querySelector('.not-found-path').textContent = path;
        }

        // Did you mean: exact alias, then shared prefix, then bigram overlap.
        function bigrams(s) {
            var out = [];
            for (var i = 0; i < s.length - 1; i++) out.push(s.slice(i, i + 2));
            return out;
        }
        function dice(a, b) {
            if (a.length < 2 || b.length < 2) return 0;
            var x = bigrams(a), y = bigrams(b), total = x.length + y.length, hits = 0;
            x.forEach(function (g) { var i = y.indexOf(g); if (i !== -1) { hits++; y.splice(i, 1); } });
            return (2 * hits) / total;
        }
        function score(key) {
            if (key === slug) return 1;
            if (slug.length >= 3 && (key.indexOf(slug) === 0 || slug.indexOf(key) === 0)) return 0.8;
            return dice(slug, key);
        }
        if (slug) {
            var best = null, bestScore = 0;
            PAGES.forEach(function (p) {
                p.keys.forEach(function (k) {
                    var s = score(k);
                    if (s > bestScore) { bestScore = s; best = p; }
                });
            });
            if (best && bestScore >= 0.5) {
                var suggest = document.querySelector('.not-found-suggest');
                var link = suggest.querySelector('a');
                link.href = best.href;
                link.textContent = best.name;
                suggest.hidden = false;
            }
        }

        // Three covers from the shelf, each linking to its series.
        var picks = document.querySelector('.not-found-picks');
        var list = picks.querySelector('ul');
        fetch('/data/books.json')
            .then(function (r) { return r.ok ? r.json() : null; })
            .then(function (data) {
                var books = data && Array.isArray(data.books) ? data.books.slice() : [];
                for (var i = books.length - 1; i > 0; i--) {
                    var j = Math.floor(Math.random() * (i + 1));
                    var t = books[i]; books[i] = books[j]; books[j] = t;
                }
                books.slice(0, 3).forEach(function (book) {
                    var li = document.createElement('li');
                    li.className = 'book';
                    var a = document.createElement('a');
                    a.className = 'book-cover';
                    a.href = '/bookshelf.html#' + (book.series ? 'series-' + book.series : 'standalone');
                    a.setAttribute('data-page-link', '');
                    a.setAttribute('aria-label', book.title);
                    var img = document.createElement('img');
                    img.src = '/covers/' + book.id + '.webp';
                    img.width = 155; img.height = 235;
                    img.alt = '';
                    img.decoding = 'async';
                    img.onerror = function () { li.remove(); if (!list.children.length) picks.hidden = true; };
                    a.appendChild(img);
                    var cap = document.createElement('p');
                    cap.className = 'book-caption';
                    var title = document.createElement('span');
                    title.className = 'book-title';
                    title.textContent = book.title;
                    cap.appendChild(title);
                    li.appendChild(a);
                    li.appendChild(cap);
                    list.appendChild(li);
                });
                if (list.children.length) picks.hidden = false;
            })
            .catch(function () {});
    })();
    </script>
</body>
</html>
